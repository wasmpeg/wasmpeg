name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

jobs:
  dco:
    if: "!contains(github.event.pull_request.labels.*.name, 'ffmpeg-bump')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: check sign-off on every commit
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          missing=0
          for sha in $(git rev-list "$base..$head"); do
            author=$(git log -1 --format='%an <%ae>' "$sha")
            if ! git log -1 --format='%B' "$sha" | grep -qiF "Signed-off-by: $author"; then
              echo "missing or mismatched sign-off: $sha $(git log -1 --format='%s' "$sha")"
              missing=1
            fi
          done
          exit $missing

  quality:
    if: "!contains(github.event.pull_request.labels.*.name, 'ffmpeg-bump')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: syntax-check every source file
        run: |
          fail=0
          while IFS= read -r -d '' f; do
            node --check "$f" || fail=1
          done < <(find src tests -name '*.js' -o -name '*.mjs' -print0)
          exit $fail

      - name: fate arg-parser check
        run: node tests/fate-runner.mjs

  # human PRs: gated behind the ok-to-test label (needs triage/write access).
  # ffmpeg-bump PRs: bot-authored, known deterministic content, no fork-PR
  # trust question — runs on its own, not behind dco/quality since those
  # don't run for it either. always() so a skipped dco/quality doesn't also
  # skip this (GitHub skips a job by default if anything in `needs` skipped).
  build:
    needs: [dco, quality]
    if: |
      always() &&
      (contains(github.event.pull_request.labels.*.name, 'ok-to-test') ||
       contains(github.event.pull_request.labels.*.name, 'ffmpeg-bump'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # setup-emsdk must run before setup-node — its PATH entry shadows
      # node's own install otherwise (emsdk-main/node/<ver>/bin/node)
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.64
          actions-cache-folder: emsdk-cache

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: build cpu target
        run: PRESET=lgpl TARGET=cpu bash scripts/build.sh

      - name: verify
        run: make verify

  # needs a self-hosted runner labeled "fate" with fate-suite already rsynced
  # (rsync://fate-suite.ffmpeg.org/fate-suite/) — queues until one exists.
  fate:
    needs: [build]
    if: |
      always() && needs.build.result == 'success' &&
      (contains(github.event.pull_request.labels.*.name, 'ok-to-test') ||
       contains(github.event.pull_request.labels.*.name, 'ffmpeg-bump'))
    runs-on: [self-hosted, fate]
    steps:
      - uses: actions/checkout@v4

      - run: rsync -a rsync://fate-suite.ffmpeg.org/fate-suite/ fate-suite/

      - run: PRESET=gpl TARGET=cpu bash scripts/build.sh

      - run: node tests/compat.mjs && node tests/fate.mjs --workers=2
