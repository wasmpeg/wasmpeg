name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

jobs:
  dco:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: check sign-off on every commit
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          missing=0
          for sha in $(git rev-list "$base..$head"); do
            author=$(git log -1 --format='%an <%ae>' "$sha")
            if ! git log -1 --format='%B' "$sha" | grep -qiF "Signed-off-by: $author"; then
              echo "missing or mismatched sign-off: $sha $(git log -1 --format='%s' "$sha")"
              missing=1
            fi
          done
          exit $missing

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: syntax-check every source file
        run: |
          fail=0
          while IFS= read -r -d '' f; do
            node --check "$f" || fail=1
          done < <(find src tests -name '*.js' -o -name '*.mjs' -print0)
          exit $fail

      - name: fate arg-parser check
        run: node tests/fate-runner.mjs

  # gated: needs the ok-to-test label, which needs triage/write access to apply
  build:
    needs: [dco, quality]
    if: contains(github.event.pull_request.labels.*.name, 'ok-to-test')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # setup-emsdk must run before setup-node — its PATH entry shadows
      # node's own install otherwise (emsdk-main/node/<ver>/bin/node)
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.64
          actions-cache-folder: emsdk-cache

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: build cpu target
        run: PRESET=lgpl TARGET=cpu bash scripts/build.sh

      - name: verify
        run: make verify

  # FATE (compat.mjs/fate.mjs, ~1.3GB fate-suite) waits on a self-hosted
  # runner with fate-suite already rsynced — not wired up yet:
  #
  #   fate:
  #     needs: [build]
  #     if: contains(github.event.pull_request.labels.*.name, 'ok-to-test')
  #     runs-on: [self-hosted, fate]
  #     steps:
  #       - uses: actions/checkout@v4
  #       - run: rsync -a rsync://fate-suite.ffmpeg.org/fate-suite/ fate-suite/
  #       - run: PRESET=gpl TARGET=cpu bash scripts/build.sh
  #       - run: node tests/compat.mjs && node tests/fate.mjs --workers=2
