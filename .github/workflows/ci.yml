name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # setup-emsdk must run before setup-node: it prepends its own directory
      # to PATH, and that directory contains a subdirectory literally named
      # "node" (its bundled toolchain, emsdk-main/node/<version>/bin/node).
      # If it runs second, that shadows setup-node's real node install —
      # bash resolves bare `node` to the directory (every dir passes the
      # executable-bit test) and exec() on it fails with "Permission denied".
      # Caught by a local `act` run against a cold checkout, not by anything
      # working on a machine that already had these tools installed.
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.64
          actions-cache-folder: emsdk-cache

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: build cpu target
        run: PRESET=lgpl TARGET=cpu bash scripts/build.sh

      - name: verify
        run: make verify

  dco:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # CONTRIBUTING.md: "PRs without sign-offs will not be merged."
      - name: check sign-off on every commit
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          missing=0
          for sha in $(git rev-list "$base..$head"); do
            author=$(git log -1 --format='%an <%ae>' "$sha")
            if ! git log -1 --format='%B' "$sha" | grep -qiF "Signed-off-by: $author"; then
              echo "missing or mismatched sign-off: $sha $(git log -1 --format='%s' "$sha")"
              missing=1
            fi
          done
          exit $missing
