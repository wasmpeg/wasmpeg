name: ffmpeg-bump

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      needed: ${{ steps.check.outputs.needed }}
      major-bump: ${{ steps.check.outputs.major-bump }}
    steps:
      - uses: actions/checkout@v7

      - id: check
        run: |
          current=$(cat vendor/ffmpeg/RELEASE)
          latest=$(curl -s "https://api.github.com/repos/FFmpeg/FFmpeg/tags?per_page=30" \
            | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{
                const t=JSON.parse(d).map(x=>x.name).filter(n=>/^n\d+\.\d+(\.\d+)?\$/.test(n));
                const parts=n=>n.slice(1).split('.').map(Number);
                t.sort((a,b)=>{const x=parts(a),y=parts(b);for(let i=0;i<3;i++){const d=(y[i]||0)-(x[i]||0);if(d)return d;}return 0;});
                console.log(t[0].replace(/^n/,''));
              })")
          echo "current=$current  latest=$latest"
          if [ "$current" = "$latest" ]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "tag=n$latest" >> "$GITHUB_OUTPUT"
            current_major="${current%%.*}"
            latest_major="${latest%%.*}"
            if [ "$current_major" != "$latest_major" ]; then
              echo "major-bump=true" >> "$GITHUB_OUTPUT"
            else
              echo "major-bump=false" >> "$GITHUB_OUTPUT"
            fi
          fi

  bump:
    needs: check
    if: needs.check.outputs.needed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - run: |
          git config user.name "wasmpeg-bot"
          git config user.email "bot@wasmpeg.com"

      - name: bump vendor/ffmpeg
        run: bash scripts/bump-ffmpeg.sh ${{ needs.check.outputs.tag }} || true

      - name: bump package.json version
        env:
          MAJOR_BUMP: ${{ needs.check.outputs.major-bump }}
        run: |
          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            const [major, minor] = p.version.split('.').map(Number);
            p.version = process.env.MAJOR_BUMP === 'true'
              ? \`\${major + 1}.0.0\`
              : \`\${major}.\${minor + 1}.0\`;
            fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          "

      - name: finalize commit
        run: |
          if [ -n "$(git ls-files -u)" ]; then
            git add -A
            git commit -s -m "ffmpeg: bump to ${{ needs.check.outputs.tag }}"
          else
            git commit --amend -s --no-edit
          fi

      - name: open pr
        uses: peter-evans/create-pull-request@v6
        with:
          branch: ffmpeg-bump/${{ needs.check.outputs.tag }}
          title: "ffmpeg: bump to ${{ needs.check.outputs.tag }}"
          body: |
            Automated bump of `vendor/ffmpeg/` to `${{ needs.check.outputs.tag }}`. If `git subtree pull`
            hit conflicts, they're committed as-is — check the diff before applying `ok-to-test`.
          labels: ffmpeg-bump
          commit-message: "ffmpeg: bump to ${{ needs.check.outputs.tag }}"
