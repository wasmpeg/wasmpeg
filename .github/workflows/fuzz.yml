name: fuzz

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
    inputs:
      time_per_target:
        description: 'Seconds to fuzz each target (default 300)'
        default: '300'

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: fuzz/Dockerfile
          tags: wasmpeg-fuzz:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Coverage-guided corpus persists across nightly runs instead of
      # restarting from empty every time — that's the difference between
      # "runs every night" and "actually gets deeper every night". Restored
      # and saved explicitly (not the single-shot actions/cache) so a run
      # that finds a crash and fails still saves what it grew before failing.
      - uses: actions/cache/restore@v6
        with:
          path: fuzz-corpus
          key: fuzz-corpus-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-${{ github.ref_name }}-
            fuzz-corpus-main-

      - name: fuzz
        id: fuzz
        run: |
          mkdir -p fuzz-corpus fuzz-crashes
          docker run --rm \
            -v "$PWD/fuzz-corpus:/corpus" \
            -v "$PWD/fuzz-crashes:/crashes" \
            -e "TIME_PER_TARGET=${{ github.event.inputs.time_per_target || '300' }}" \
            wasmpeg-fuzz

      - uses: actions/cache/save@v6
        if: always()
        with:
          path: fuzz-corpus
          key: fuzz-corpus-${{ github.ref_name }}-${{ github.run_id }}

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: fuzz-crashes
          path: fuzz-crashes
          if-no-files-found: ignore
          retention-days: 90
