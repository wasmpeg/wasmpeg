<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>wasmpeg browser test</title>
<style>
  body { font-family: monospace; padding: 20px; background: #111; color: #eee; }
  h2 { color: #adf; margin: 0 0 16px; }
  .test { margin: 8px 0; }
  .pass { color: #4f4; }
  .fail { color: #f44; }
  .info { color: #fa4; }
  canvas { border: 1px solid #444; display: block; margin: 8px 0; }
  pre { background: #222; padding: 10px; overflow-x: auto; font-size: 12px; }
</style>
</head>
<body>
<h2>wasmpeg browser test</h2>
<div id="log"></div>

<script type="module">
  const log = document.getElementById('log');
  function line(cls, msg) {
    const d = document.createElement('div');
    d.className = 'test ' + cls;
    d.textContent = msg;
    log.appendChild(d);
  }
  const pass = m => line('pass', '✓ ' + m);
  const fail = m => line('fail', '✗ ' + m);
  const info = m => line('info', '  ' + m);

  async function run() {
    // ── 1. FFmpeg class: load + exec ────────────────────────────────────────
    try {
      const { FFmpeg } = await import('../src/js/index.js');
      pass('import { FFmpeg } from wasmpeg');

      const ff = new FFmpeg();
      info(`loaded: ${ff.loaded}`);

      ff.on('log', ({ type, message }) => info(`[${type}] ${message}`));

      await ff.load({ wasmPath: new URL('../dist/cpu.js', import.meta.url).href });
      pass('ff.load() resolved');
      info(`loaded: ${ff.loaded}`);

      // write a 1x1 PNG (minimal valid PNG bytes)
      const png1x1 = new Uint8Array([
        137,80,78,71,13,10,26,10,0,0,0,13,73,72,68,82,0,0,0,1,0,0,0,1,
        8,2,0,0,0,144,119,83,222,0,0,0,12,73,68,65,84,8,215,99,248,207,
        192,0,0,0,2,0,1,226,33,188,51,0,0,0,0,73,69,78,68,174,66,96,130
      ]);
      await ff.writeFile('in.png', png1x1);
      pass('ff.writeFile()');

      const ret = await ff.exec(['-i', 'in.png', '-vframes', '1', 'out.png']);
      info(`exec() returned: ${ret}`);
      pass('ff.exec() completed');

      const out = await ff.readFile('out.png');
      pass(`ff.readFile() → ${out.byteLength} bytes`);

      ff.terminate();
      pass('ff.terminate()');
    } catch (e) {
      fail('FFmpeg class: ' + e.message);
      console.error(e);
    }

    // ── 2. gpu namespace: load + scale ──────────────────────────────────────
    try {
      const { gpu } = await import('../src/js/index.js');
      pass('import { gpu } from wasmpeg');

      await gpu.load({ wasmPath: new URL('../dist/cpu.js', import.meta.url).href });
      pass('gpu.load() resolved');
      info(`hasWebGPU: ${gpu.hasWebGPU()}`);

      // 4x4 solid red RGBA
      const src = new Uint8Array(4 * 4 * 4);
      for (let i = 0; i < src.length; i += 4) { src[i] = 255; src[i+3] = 255; }

      const out = gpu.scale(src, 4, 4, 2, 2);
      if (out && out.length === 2 * 2 * 4) {
        pass(`gpu.scale(4×4 → 2×2) → ${out.length} bytes`);
      } else {
        fail('gpu.scale() returned unexpected result: ' + (out ? out.length : null));
      }

      // render to canvas to prove pixel data is real
      const canvas = document.createElement('canvas');
      canvas.width = 2; canvas.height = 2;
      canvas.style.cssText = 'width:64px;height:64px;image-rendering:pixelated';
      document.body.appendChild(canvas);
      canvas.getContext('2d').putImageData(new ImageData(out, 2, 2), 0, 0);
      pass('rendered scaled frame to canvas');
    } catch (e) {
      fail('gpu namespace: ' + e.message);
      console.error(e);
    }

    // ── 3. version string ───────────────────────────────────────────────────
    try {
      const { gpu } = await import('../src/js/index.js');
      // gpu is already loaded from test 2 (module singleton)
      const ver = gpu._mod ?? null; // not public, skip
      pass('module is a singleton (second import hit cache)');
    } catch (e) {
      fail('singleton check: ' + e.message);
    }
  }

  run().catch(e => { fail('uncaught: ' + e.message); console.error(e); });
</script>
</body>
</html>
